# In the HTTPS server {} managed by Baota. Replace any existing location /
# and disable PHP/rewrite/static-extension rules for this dedicated site.
# Baota manages TLS certificates. Never expose the project directory as web root.
server_tokens off;
client_max_body_size 26m;
client_body_timeout 20s;
client_header_timeout 10s;
send_timeout 30s;
keepalive_timeout 30s;
limit_conn rental_connections 20;
access_log /www/wwwlogs/rental-atlas.access.log rental_safe;

# No caching of account/listing/contact responses, including at the CDN.
location ^~ /api/auth/ {
    limit_req zone=rental_auth burst=15 nodelay;
    client_max_body_size 4k;
    include /www/server/nginx/conf/rental-proxy.conf;
}
location ^~ /api/ {
    limit_req zone=rental_api burst=40 nodelay;
    include /www/server/nginx/conf/rental-proxy.conf;
}
location / {
    include /www/server/nginx/conf/rental-proxy.conf;
}

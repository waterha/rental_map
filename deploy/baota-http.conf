# Paste into Nginx's http {} block, outside all server {} blocks. Reload only
# after `nginx -t`. These complement (and do not replace) the Go admission limits.
limit_req_zone $binary_remote_addr zone=rental_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rental_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=rental_connections:10m;
limit_req_status 429;
limit_conn_status 429;
log_format rental_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

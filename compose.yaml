services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rental_atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d rental_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build:
      context: .
      secrets:
        - amap_env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://atlas:${POSTGRES_PASSWORD}@db:5432/rental_atlas?sslmode=disable
      ADDR: 0.0.0.0:8080
      ALLOW_PUBLISH: ${ALLOW_PUBLISH:-false}
    env_file:
      - .env.server.local
    volumes:
      - auth_runtime:/app/data/runtime
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  auth_runtime:
secrets:
  amap_env:
    file: .env.local
